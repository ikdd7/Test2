<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0f1a" />
  <title>Ripple · 실시간 채팅</title>
  <meta name="description" content="가입 없이 1초 만에 시작하는 실시간 채팅. 방 이름만 입력하면 끝." />

  <!-- Open Graph -->
  <meta property="og:title" content="Ripple · 실시간 채팅" />
  <meta property="og:description" content="가입 없이 1초 만에 시작하는 실시간 채팅. 링크만 공유하면 친구가 바로 들어와요." />
  <meta property="og:type" content="website" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <!-- ============ 로그인 / 입장 화면 ============ -->
  <section id="join-screen" class="join-screen">
    <div class="join-card">
      <div class="brand">
        <div class="brand-logo">💬</div>
        <h1>Ripple</h1>
        <p class="tagline">가입 없이 1초 만에 시작하는 실시간 채팅</p>
      </div>

      <form id="join-form" class="join-form" autocomplete="off">
        <label class="field">
          <span>닉네임</span>
          <input id="nickname-input" type="text" maxlength="20" placeholder="멋진 이름을 지어보세요" required />
        </label>

        <label class="field">
          <span>채팅방 이름</span>
          <input id="room-input" type="text" maxlength="30" placeholder="예: 자유수다방" required />
        </label>

        <div class="avatar-preview">
          <div id="avatar-bubble" class="avatar-bubble">?</div>
          <div class="avatar-hint">
            <strong id="avatar-name">미리보기</strong>
            <span>아바타는 닉네임으로 자동 생성돼요</span>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="join-btn">
          <span>입장하기</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>

      <div class="suggestions">
        <span>인기 방:</span>
        <button class="chip" data-room="자유수다방">자유수다방</button>
        <button class="chip" data-room="개발자라운지">개발자라운지</button>
        <button class="chip" data-room="심야감성">심야감성</button>
        <button class="chip" data-room="게임">게임</button>
      </div>

      <p class="footnote">서버에 메시지가 저장되지 않아요. 누구나 익명으로 즐기세요. 🤫</p>
    </div>
  </section>

  <!-- ============ 채팅 화면 ============ -->
  <section id="chat-screen" class="chat-screen hidden">
    <header class="chat-header">
      <button class="icon-btn" id="leave-btn" title="나가기" aria-label="나가기">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="room-meta">
        <h2 id="room-title"># 방</h2>
        <div class="presence">
          <span class="dot" id="conn-dot"></span>
          <span id="presence-text">연결 중…</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="share-btn" title="초대 링크 복사" aria-label="초대 링크 복사">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M8.7 13.5l6.6 3.8M15.3 6.7L8.7 10.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="18" cy="5" r="2.6" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="12" r="2.6" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="19" r="2.6" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button class="icon-btn" id="sound-btn" title="알림음 켜기/끄기" aria-label="알림음">
          <svg id="sound-on" width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M11 5L6 9H2v6h4l5 4V5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg id="sound-off" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M11 5L6 9H2v6h4l5 4V5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M22 9l-6 6M16 9l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite"></main>

    <div id="typing-indicator" class="typing-indicator hidden">
      <span class="typing-dots"><i></i><i></i><i></i></span>
      <span id="typing-text"></span>
    </div>

    <footer class="composer">
      <button class="icon-btn emoji-toggle" id="emoji-btn" title="이모지" aria-label="이모지">😊</button>
      <div id="emoji-panel" class="emoji-panel hidden"></div>
      <input id="message-input" type="text" maxlength="500" placeholder="메시지를 입력하세요…" autocomplete="off" />
      <button class="send-btn" id="send-btn" title="보내기" aria-label="보내기">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 12l16-8-6 16-2.5-6.5L4 12z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </button>
    </footer>
  </section>

  <div id="toast" class="toast hidden"></div>

  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
