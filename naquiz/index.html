<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>너 나 얼마나 알아? · 나퀴즈</title>
<meta property="og:title" content="너 나 얼마나 알아? 🧐" />
<meta property="og:description" content="내 친구가 나를 얼마나 아는지 퀴즈로 확인! 가입 없이 1분." />
<style>
  :root{
    --bg:#fff6f1; --card:#fff; --text:#463a50; --dim:#a294ad;
    --accent:#ff8fa3; --accent2:#b89bff; --line:rgba(74,46,63,.10);
    --grad:linear-gradient(135deg,#ffb088,#ff8fa3 55%,#b89bff);
    --shadow:0 14px 34px rgba(190,140,165,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  body{background:radial-gradient(900px 600px at 85% -8%,#ffe2d4,transparent 60%),radial-gradient(800px 600px at -8% 108%,#e9dcff,transparent 58%),var(--bg);color:var(--text);min-height:100vh}
  .wrap{max-width:480px;margin:0 auto;padding:22px 18px 60px;min-height:100vh;display:flex;flex-direction:column}
  .card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px 22px;box-shadow:var(--shadow);animation:pop .4s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
  .logo{font-size:40px;text-align:center}
  h1{font-size:24px;text-align:center;margin:8px 0 4px;line-height:1.3}
  .sub{color:var(--dim);text-align:center;font-size:14px;margin-bottom:22px;line-height:1.5}
  .q{font-weight:800;font-size:18px;margin:0 0 14px}
  .qnum{color:var(--accent);font-weight:800}
  .opt{display:block;width:100%;text-align:left;background:#faf6f9;border:2px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:10px;font-size:15.5px;color:var(--text);cursor:pointer;transition:.15s}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{background:var(--grad);color:#fff;border-color:transparent;font-weight:700}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--grad);color:#fff;font-weight:800;font-size:17px;border:none;border-radius:16px;padding:16px;cursor:pointer;box-shadow:0 10px 24px rgba(255,143,163,.4);transition:.12s}
  .btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
  .btn:disabled{opacity:.4;box-shadow:none;cursor:default}
  .btn.ghost{background:#f3eef7;color:var(--text);box-shadow:none}
  .field{width:100%;border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-size:16px;color:var(--text);margin-bottom:8px}
  .field:focus{outline:none;border-color:var(--accent)}
  .progress{height:8px;background:#f0e8f0;border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar{height:100%;background:var(--grad);width:0;transition:width .3s}
  .linkbox{display:flex;gap:8px;margin:14px 0}
  .linkbox input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:12px;font-size:12px;color:var(--dim)}
  .copy{background:var(--grad);color:#fff;border:none;border-radius:12px;padding:0 16px;font-weight:700;cursor:pointer}
  .score{font-size:64px;font-weight:900;text-align:center;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
  .tier-emoji{font-size:60px;text-align:center}
  .tier-title{font-size:24px;font-weight:900;text-align:center;margin:4px 0}
  .muted{color:var(--dim);font-size:13px;text-align:center;margin-top:18px}
  .hidden{display:none!important}
  .footer{margin-top:auto;text-align:center;color:var(--dim);font-size:12px;padding-top:24px}
  .review{background:#faf6f9;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:14px}
  .review b{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">

  <!-- 1) 홈/만들기 시작 -->
  <section id="s-home" class="card">
    <div class="logo">🧐</div>
    <h1>내 친구는<br/>나를 얼마나 알까?</h1>
    <p class="sub">내 답을 정하고 링크를 보내면<br/>친구가 맞혀요. 가입 없이 1분 ⏱️</p>
    <input id="name" class="field" maxlength="12" placeholder="내 이름(또는 닉네임)" />
    <button id="start" class="btn">나만의 퀴즈 만들기 ✏️</button>
    <p class="muted">친구가 만든 링크로 들어왔다면 바로 시작돼요</p>
  </section>

  <!-- 2) 만들기(내 답 고르기) -->
  <section id="s-make" class="card hidden">
    <div class="progress"><div id="mbar" class="bar"></div></div>
    <p class="q"><span id="mnum" class="qnum">Q1</span> <span id="mq"></span></p>
    <div id="mopts"></div>
  </section>

  <!-- 3) 공유 -->
  <section id="s-share" class="card hidden">
    <div class="logo">🎉</div>
    <h1>퀴즈 완성!</h1>
    <p class="sub">이 링크를 친구에게 보내고<br/>몇 점 맞히는지 구경하세요 👀</p>
    <div class="linkbox"><input id="link" readonly /><button id="copy" class="copy">복사</button></div>
    <button id="kakao" class="btn">카톡으로 공유하기 💬</button>
    <button id="preview" class="btn ghost" style="margin-top:10px">내 퀴즈 미리 풀어보기</button>
  </section>

  <!-- 4) 풀기 -->
  <section id="s-take" class="card hidden">
    <div class="progress"><div id="tbar" class="bar"></div></div>
    <p id="towner" class="sub" style="margin-bottom:14px"></p>
    <p class="q"><span id="tnum" class="qnum">Q1</span> <span id="tq"></span></p>
    <div id="topts"></div>
  </section>

  <!-- 5) 결과 -->
  <section id="s-result" class="card hidden">
    <div id="remoji" class="tier-emoji"></div>
    <div id="rscore" class="score"></div>
    <div id="rtitle" class="tier-title"></div>
    <p id="rdesc" class="sub"></p>
    <button id="r-make" class="btn">나도 내 퀴즈 만들기 🔥</button>
    <button id="r-share" class="btn ghost" style="margin-top:10px">친구들한테 결과 자랑하기</button>
    <p class="muted">친구마다 점수가 달라요. 누가 1등일까? 🏆</p>
  </section>

  <div class="footer">나퀴즈 · 가입 없이 만드는 우정 테스트</div>
</div>

<script src="quiz-core.js"></script>
<script src="app.js"></script>
</body>
</html>
